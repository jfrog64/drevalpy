# --- RF auf DIPKs Feature-Bausteinen (AE + gepooltes MolGNet), Ablations-Faktorial 2026-08-06 ---
# Alle sechs Zellen erben die RF-Hyperparameter der Referenz (n_estimators 100, max_depth 30,
# max_samples 0.2) — damit unterscheiden sich die Arme NUR im Feature-Satz.
# Referenzzellen des Faktorials sind die bestehenden RandomForest (893 via gene_list) und
# RandomForestTargetMut893.
# AE: Genraum + log2(TPM+1) exakt wie DIPKLOG; batch 64 statt DIPKs 1024, weil auf den EINDEUTIGEN
# Trainingszelllinien trainiert wird (~800 Zeilen, mit 1024 waere eine Epoche ein einziger Schritt).
# MolGNet: die Knoten-Embeddings haben 768 Dims (nicht 43 wie im Auftrag angenommen)
# -> mean+max-Pooling ergibt 1536 Drug-Features.
# 2026-08-06: -Mut-Referenzzelle des DIPK-Feature-Faktorials. Identisch zu RandomForestTargetMut893,
# nur ohne das Mut-Feature -- die registrierte `RandomForest`-Basis nutzt 270 Gene und waere als
# Referenz mit dem Genraum konfundiert.
RandomForest893:
  cell_line_views:
    - gene_expression
  drug_views:
    - fingerprints
  n_estimators:
    - 100
  max_depth:
    - 30
  max_samples:
    - 0.2
  n_jobs:
    - -1
  criterion:
    - squared_error
  gene_list:
    - landmark_plus_clinical_drivers

RandomForestAE:
  cell_line_views:
    - gene_expression
  drug_views:
    - fingerprints
  gene_list:
    - tcga_autoencoder_genes_available
  n_estimators:
    - 100
  max_depth:
    - 30
  max_samples:
    - 0.2
  n_jobs:
    - -1
  criterion:
    - squared_error
  ae_log2:
    - true
  # AE-Schedule aus Benchmark 2026-08-06 (815 Zelllinien x 11883 Gene, log2, Fold-Groesse real):
  #   batch64/pat20 -> Stopp ep72,  best Val-MSE 0.970,  39 s
  #   batch64/pat50 -> Stopp ep308, best Val-MSE 0.762, 166 s
  #   batch32/pat50 -> Stopp ep280, best Val-MSE 0.733, 285 s   <- gewaehlt
  # pat20 stoppt deutlich zu frueh (Val-Kurve faellt noch); 285 s/Fold sind gegen ~7 h Gesamtlauf
  # vernachlaessigbar und der Encoder wird ohnehin je Fold nur EINMAL trainiert (AE-Cache).
  epochs_autoencoder:
    - 2000
  ae_batch_size:
    - 32
  ae_patience:
    - 50

