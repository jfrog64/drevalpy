# Drug-Level-Trim (2026-09-04): identisch zu RandomForestAEMolGNetMut, aber die Substanzen jenseits
# der Rausch-Kante fehlen im TRAINING ganz. Nicht mit …Trim verwechseln -- das ist der pointwise Arm.
RandomForestAEMolGNetMutDrugTrim:
  cell_line_views:
    - gene_expression
  drug_views:
    - molgnet_pooled
  gene_list:
    - tcga_autoencoder_genes_available
  n_estimators:
    - 100
  max_depth:
    - 30
  max_samples:
    - 0.2
  n_jobs:
    - -1
  criterion:
    - squared_error
  ae_log2:
    - true
  # AE-Schedule wie im Referenzarm (Benchmark 2026-08-06); der Encoder kommt ohnehin aus dem Cache.
  epochs_autoencoder:
    - 2000
  ae_batch_size:
    - 32
  ae_patience:
    - 50
  molgnet_pooling:
    - mean_max
  target_missing:
    - missing
  target_include_aligned:
    - true
  # Schwelle = die gemessene Kante: bis 50 % unbestimmbarer Kurven je Drug bleibt die Guete stabil
  # (Median within-drug rho 0,414/0,417/0,424), darueber bricht sie weg (0,285 bzw. 0,004).
  # Fuer die Variante "nur die 43 hoffnungslosen Drugs" genuegt drug_trim_max_bad_frac: 0.9.
  drug_trim_bad_pec50_error:
    - 1.0
  drug_trim_max_bad_frac:
    - 0.5
  # Substanzen mit weniger als so vielen bewertbaren Trainingszeilen werden nicht beschnitten
  # (Schaetzung des Anteils zu wacklig); in LCO/CTRPv2 bindet das nie.
  drug_trim_min_curves:
    - 10

RandomForestAEMolGNetMutBJ:
  cell_line_views:
    - gene_expression
  drug_views:
    - molgnet_pooled
  gene_list:
    - tcga_autoencoder_genes_available
  n_estimators:
    - 100
  max_depth:
    - 30
  max_samples:
    - 0.2
  n_jobs:
    - -1
  criterion:
    - squared_error
  ae_log2:
    - true
  # AE-Schedule aus Benchmark 2026-08-06 (815 Zelllinien x 11883 Gene, log2, Fold-Groesse real):
  #   batch64/pat20 -> Stopp ep72,  best Val-MSE 0.970,  39 s
  #   batch64/pat50 -> Stopp ep308, best Val-MSE 0.762, 166 s
  #   batch32/pat50 -> Stopp ep280, best Val-MSE 0.733, 285 s   <- gewaehlt
  # pat20 stoppt deutlich zu frueh (Val-Kurve faellt noch); 285 s/Fold sind gegen ~7 h Gesamtlauf
  # vernachlaessigbar und der Encoder wird ohnehin je Fold nur EINMAL trainiert (AE-Cache).
  epochs_autoencoder:
    - 2000
  ae_batch_size:
    - 32
  ae_patience:
    - 50
  molgnet_pooling:
    - mean_max
  target_missing:
    - missing
  target_include_aligned:
    - true

  # Buckley-James (2026-09-03): Ziel zensierter Zeilen je Runde auf max(Schranke, OOB-Vorhersage)
  # setzen. bj_iterations = 1 waere exakt das gekappte Basismodell (gp20260903c_capped), 3 Runden
  # kosten drei Fits je Fold statt einem -- Laufzeit x3 im RF-Teil, AE-Encoder unveraendert.
  bj_iterations:
    - 3
  bj_update_source:
    - oob
  bj_tolerance:
    - 0.001
