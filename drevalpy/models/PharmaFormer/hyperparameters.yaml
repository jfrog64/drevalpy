# REDUZIERTES Grid fürs Vollfeld-Ranking (Claude Code 2026-07-25): nur lr × num_layers × nhead
# = 2×2×2 = 8 Konfigs × 5 Folds (statt Default 512 → unbrauchbar ~3 Wochen auf 4-GB-Karte).
# Rest fest auf schnelle, speichersichere Defaults (VRAM-Peak beim Vollgrid-Test nur 455 MiB).
# Original: hyperparameters.yaml.fullgrid.bak (User-Entscheidung 2026-07-25: "kleines Grid ~8 Konfigs").
PharmaFormer:
  gene_hidden_size:
    - 2048
  drug_hidden_size:
    - 128
  feature_dim:
    - 64
  nhead:
    - 4
    - 8
  num_layers:
    - 2
    - 3
  dim_feedforward:
    - 1024
  dropout:
    - 0.1
  batch_size:
    - 128
  lr:
    - 0.00001
    - 0.0001
  epochs:
    - 100
  patience:
    - 10
